name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to
        required: true
        default: v0.1.0
      ref:
        description: Optional branch or tag to build (defaults to the tag input)
        required: false
        default: ''
      publish:
        description: Upload artifacts to the release
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: linux
            bundles: appimage,deb
            files: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            artifact: windows
            bundles: nsis
            files: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - name: Verify release tag matches app version
        shell: bash
        run: node scripts/check-release-version.mjs "${{ github.event.inputs.tag || github.ref_name }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.name }} bundle
        shell: bash
        run: |
          cd apps/desktop
          ../../node_modules/.bin/tauri build --bundles "${{ matrix.bundles }}"

      - name: Smoke test Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb xdotool libfuse2 dbus-x11
          APP=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          test -n "$APP"
          chmod +x "$APP"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            "$1" --appimage-extract-and-run > /tmp/familiweave-linux.log 2>&1 &
            pid=$!
            found=0
            for i in $(seq 1 30); do
              if xdotool search --name Familiweave >/dev/null 2>&1; then found=1; break; fi
              sleep 1
            done
            if [ "$found" != "1" ]; then
              cat /tmp/familiweave-linux.log || true
              kill "$pid" 2>/dev/null || true
              exit 1
            fi
            sleep 2
            kill "$pid" 2>/dev/null || true
          ' bash "$APP"

      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $installDir = Join-Path $env:RUNNER_TEMP "Familiweave"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait
          $app = Get-ChildItem -Path $installDir, (Join-Path $env:LOCALAPPDATA "Familiweave") -Include "familiweave-desktop.exe", "Familiweave.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) {
            Get-ChildItem -Path $installDir, (Join-Path $env:LOCALAPPDATA "Familiweave") -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw "Installed Familiweave executable not found"
          }
          Start-Process -FilePath $app.FullName
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Name "familiweave-desktop", "Familiweave" -ErrorAction SilentlyContinue)) { throw "Familiweave process did not start" }
          Stop-Process -Name "familiweave-desktop", "Familiweave" -Force -ErrorAction SilentlyContinue

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: familiweave-${{ matrix.artifact }}-${{ github.event.inputs.tag || github.ref_name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach assets to release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done | sort -k2 > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Desktop builds for $TAG."
          fi
          find release-assets -type f -print
          find release-assets -type f -exec gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber {} +
          mkdir -p verified-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified-assets --clobber
          (cd verified-assets && sha256sum -c SHA256SUMS.txt)
